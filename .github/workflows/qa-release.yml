name: QA release pipeline

# Replaces the per-repo qa-release.yml.tmpl render - same reasoning as
# dev-pipeline.yml. See CLAUDE.md.
#
# `uses:` can't take an expression, so the composite-action refs below are a
# static @v1 - bump them here to release, not in every generated caller. No
# `permissions:` block here either: the calling job's is the ceiling for
# every job below, so it needs to grant contents:read, packages:write,
# pull-requests:write to cover all of them.

on:
  workflow_call:
    inputs:
      service-name:
        description: Image tag suffix, component-name/component-label, e.g. "api".
        required: true
        type: string
      service-label:
        description: Human label in the Trivy comment header, e.g. "api".
        required: true
        type: string
      helm-key:
        description: Full yq path into the charts repo's values file, e.g. ".services.api.imageTag".
        required: true
        type: string
      dockerfile-target:
        description: Optional --target stage; leave default for none.
        required: false
        type: string
        default: ""
      build-args:
        description: >-
          Newline-separated KEY=VALUE lines, already resolved by the caller;
          leave default for none.
        required: false
        type: string
        default: ""
      integration-branch:
        description: Branch the values-bump PR targets, e.g. "develop".
        required: true
        type: string
      helm-repo:
        description: Helm-charts repo holding the values file, as "owner/name".
        required: true
        type: string
      helm-owner:
        description: Owner portion of helm-repo, for the GitHub App token step.
        required: true
        type: string
      helm-repo-name:
        description: Repo-name portion of helm-repo, for the GitHub App token step.
        required: true
        type: string
      runner:
        description: Runner label for every job.
        required: false
        type: string
        default: ubuntu-latest
      helm-bot-client-id:
        description: Caller's vars.HELM_BOT_CLIENT_ID.
        required: true
        type: string
    secrets:
      helm-bot-app-private-key:
        description: Caller's secrets.HELM_BOT_APP_PRIVATE_KEY.
        required: true

env:
  REGISTRY: ghcr.io
  # GHCR paths must be lowercase; set this explicitly if your owner or repo
  # name has uppercase letters.
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name }}-${{ inputs.service-name }}

jobs:
  build-scan-push:
    name: Build, Trivy Scan, and Push
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      pull-requests: write
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: pr
        uses: atkaridarshan04/shared-ci-actions/.github/actions/resolve-pr-for-branch@v1
        with:
          branch: ${{ github.ref_name }}

      # build and scan before logging in: nothing unscanned can reach the registry
      - uses: atkaridarshan04/shared-ci-actions/.github/actions/build-candidate-image@v1
        with:
          image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          dockerfile-target: ${{ inputs.dockerfile-target }}
          build-args: |
            ${{ inputs.build-args }}

      - uses: atkaridarshan04/shared-ci-actions/.github/actions/trivy-scan-and-comment@v1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          label: ${{ inputs.service-label }} image
          pr-number: ${{ steps.pr.outputs.pr-number }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

  update-helm-repo:
    name: Update QA values.yaml (PR to ${{ inputs.integration-branch }})
    runs-on: ${{ inputs.runner }}
    needs: build-scan-push
    steps:
      - id: helm-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.helm-bot-client-id }}
          private-key: ${{ secrets.helm-bot-app-private-key }}
          owner: ${{ inputs.helm-owner }}
          repositories: ${{ inputs.helm-repo-name }}
      - uses: atkaridarshan04/shared-ci-actions/.github/actions/update-helm-chart@v1
        with:
          yaml-path: ${{ inputs.helm-key }}
          helm-repo: ${{ inputs.helm-repo }}
          values-file: qa/values.yaml
          image-tag: ${{ needs.build-scan-push.outputs.image_tag }}
          component-label: ${{ inputs.service-name }}
          helm-repo-token: ${{ steps.helm-app-token.outputs.token }}
          commit-user-name: github-actions[bot]
          commit-user-email: 41898282+github-actions[bot]@users.noreply.github.com
          mode: pr
          source-branch: ${{ github.ref_name }}
          target-branch: ${{ inputs.integration-branch }}
