name: Fleet - cut a branch across repos

# A release cut is from-branch develop; a hotfix cut is from-branch release-x.y.z.
#
# Creates the branch through the Git refs API rather than cloning each repo:
# one request instead of a full clone per repo, and nothing to clean up.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated repo names, in this account"
        required: true
        default: "test-api,test-web,test-worker"
      from_branch:
        description: "Branch to cut from (develop for a release, release-x.y.z for a hotfix)"
        required: true
        default: "develop"
      new_branch:
        description: "Branch to create, e.g. release-1.3.0"
        required: true
        type: string
      dry_run:
        description: "Resolve and report only - create nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Parse repo list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse.outputs.repos }}
    steps:
      - id: parse
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          repos = [r.strip() for r in os.environ["REPOS"].split(",") if r.strip()]
          if not repos:
              sys.exit("No repos given.")
          dupes = {r for r in repos if repos.count(r) > 1}
          if dupes:
              sys.exit(f"Duplicate repos in list: {sorted(dupes)}")
          print("repos=" + json.dumps(repos))
          PY

  cut:
    name: ${{ matrix.repo }}
    needs: plan
    runs-on: ubuntu-latest
    # one repo failing must not strand the rest half-cut
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Cut branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo }}
          FROM_BRANCH: ${{ inputs.from_branch }}
          NEW_BRANCH: ${{ inputs.new_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SLUG="$OWNER/$REPO"

          if ! SHA=$(gh api "repos/$SLUG/git/ref/heads/$FROM_BRANCH" --jq .object.sha 2>/dev/null); then
            echo "::error::$SLUG has no branch '$FROM_BRANCH'"
            echo "| \`$SLUG\` | :x: source branch \`$FROM_BRANCH\` not found |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if EXISTING=$(gh api "repos/$SLUG/git/ref/heads/$NEW_BRANCH" --jq .object.sha 2>/dev/null); then
            echo "$SLUG already has '$NEW_BRANCH' at ${EXISTING:0:7} - leaving it alone"
            echo "| \`$SLUG\` | :arrow_right: already exists at \`${EXISTING:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: would create $NEW_BRANCH at ${SHA:0:7} in $SLUG"
            echo "| \`$SLUG\` | :mag: would create at \`${SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api "repos/$SLUG/git/refs" \
            -f "ref=refs/heads/$NEW_BRANCH" \
            -f "sha=$SHA" >/dev/null
          echo "Created $NEW_BRANCH at ${SHA:0:7} in $SLUG"
          echo "| \`$SLUG\` | :white_check_mark: created at \`${SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Summary
    needs: [plan, cut]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          FROM_BRANCH: ${{ inputs.from_branch }}
          NEW_BRANCH: ${{ inputs.new_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESULT: ${{ needs.cut.result }}
        run: |
          set -euo pipefail
          {
            echo "### Fleet branch cut"
            echo ""
            echo "- **From:** \`$FROM_BRANCH\`"
            echo "- **New:**  \`$NEW_BRANCH\`"
            echo "- **Dry run:** \`$DRY_RUN\`"
            echo "- **Result:** \`$RESULT\`"
            echo ""
            echo "Per-repo rows are in the \`cut\` job summaries above."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$RESULT" = "failure" ] && { echo "::error::at least one repo failed - see rows above"; exit 1; }
          exit 0
