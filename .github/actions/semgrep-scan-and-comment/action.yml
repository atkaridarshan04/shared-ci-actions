name: Semgrep scan and PR comment
description: Run Semgrep, upload the report, and post/update a PR comment with the results.
inputs:
  semgrep-configs:
    description: Space-separated Semgrep config packs, e.g. "p/python p/fastapi p/dockerfile".
    required: true
  semgrep-version:
    description: >
      Semgrep release to install. Pinned by default: an unpinned install
      means a new Semgrep release can start failing builds that passed
      yesterday, with no change on the caller's side and no way to roll back.
    required: false
    default: "1.178.0"
  fail-on-severity:
    description: >
      Lowest finding severity that fails the build - ERROR (default), WARNING,
      or INFO. Findings below it are still scanned, reported, and commented,
      they just don't gate the merge. There is deliberately no value that
      disables the gate entirely.
    required: false
    default: ERROR
  pr-number:
    description: >
      PR number to comment on for non-pull_request events (e.g. resolved via
      resolve-pr-for-branch on a release run). Leave unset on pull_request
      events - the PR is auto-detected. If unset and the event isn't a
      pull_request, the comment step is skipped (report is still uploaded).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install Semgrep
      shell: bash
      env:
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install "semgrep==${SEMGREP_VERSION}"

    # no --error here: the severity gate runs as the last step, so the report
    # and PR comment are always produced before anything fails the job
    - name: Run Semgrep scan
      shell: bash
      env:
        SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
      run: |
        set -euo pipefail

        case "$FAIL_ON_SEVERITY" in
          ERROR|WARNING|INFO) ;;
          *)
            echo "::error::fail-on-severity must be ERROR, WARNING, or INFO (got '$FAIL_ON_SEVERITY')"
            exit 1
            ;;
        esac

        CONFIG_ARGS=()
        for c in $SEMGREP_CONFIGS; do
          CONFIG_ARGS+=(--config "$c")
        done
        semgrep scan "${CONFIG_ARGS[@]}" --json --output semgrep-report.json .

    - name: Format Semgrep report (human readable)
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python <<'PY'
        import json, textwrap
        from pathlib import Path
        from datetime import datetime, timezone

        src = Path("semgrep-report.json")
        out = Path("semgrep-report.txt")
        SEP  = "=" * 70
        DASH = "-" * 70

        if not src.exists():
            out.write_text("Semgrep JSON report was not generated.\n")
            Path("semgrep-comment.md").write_text(
                "### Semgrep Scan Results\n\nSemgrep JSON report was not generated.\n"
            )
            raise SystemExit(0)

        data    = json.loads(src.read_text())
        results = data.get("results", [])
        errors  = data.get("errors",  [])

        ORDER = ["ERROR", "CRITICAL", "HIGH", "MEDIUM", "WARNING", "LOW", "INFO"]
        counts = {s: 0 for s in ORDER}
        for r in results:
            sev = (r.get("extra", {}).get("severity") or "INFO").upper()
            counts[sev] = counts.get(sev, 0) + 1

        header = [
            SEP,
            "  SEMGREP SECURITY SCAN REPORT",
            f"  Generated : {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
            f"  Findings  : {len(results)}  |  Errors: {len(errors)}",
            SEP,
            "",
            "SEVERITY SUMMARY",
            DASH,
        ]
        for sev in ORDER:
            if counts[sev]:
                header.append(f"  {sev:<10} {counts[sev]}")
        if not any(counts.values()):
            header.append("  No findings detected.")
        header += ["", SEP, "", ""]

        body = []
        for i, r in enumerate(results, 1):
            sev     = (r.get("extra", {}).get("severity") or "INFO").upper()
            rule    = r.get("check_id", "")
            path    = r.get("path", "")
            start   = r.get("start", {}).get("line", "?")
            end     = r.get("end",   {}).get("line", "?")
            message = r.get("extra", {}).get("message", "").strip()
            link    = r.get("extra", {}).get("metadata", {}).get("shortlink", "")
            cwe     = r.get("extra", {}).get("metadata", {}).get("cwe", "")
            owasp   = r.get("extra", {}).get("metadata", {}).get("owasp", "")

            block = [
                f"[{i}/{len(results)}]  {sev}",
                DASH,
                f"  Rule    : {rule}",
                f"  File    : {path}",
                f"  Lines   : {start} - {end}",
            ]
            if cwe:
                cwe_str = ", ".join(cwe) if isinstance(cwe, list) else cwe
                block.append(f"  CWE     : {cwe_str}")
            if owasp:
                owasp_str = ", ".join(owasp) if isinstance(owasp, list) else owasp
                block.append(f"  OWASP   : {owasp_str}")
            if link:
                block.append(f"  Details : {link}")
            block.append("")
            wrapped = textwrap.fill(message, width=66, initial_indent="  Message : ", subsequent_indent="             ")
            block.append(wrapped)
            block += ["", DASH, ""]
            body.extend(block)

        out.write_text("\n".join(header + body) + "\n")

        MAX_CHARS = 60000
        full_report = "\n".join(header + body)
        truncated = len(full_report) > MAX_CHARS
        if truncated:
            full_report = full_report[:MAX_CHARS]

        comment = ["### Semgrep Scan Results", ""]
        comment.append(f"**Findings:** {len(results)}  |  **Errors:** {len(errors)}")
        comment.append("")
        for sev in ORDER:
            if counts[sev]:
                comment.append(f"- **{sev}**: {counts[sev]}")
        if not any(counts.values()):
            comment.append("No findings detected.")
        comment += ["", "<details><summary>Full report</summary>", "", "```", full_report, "```", "</details>"]
        if truncated:
            comment += ["", "_Report truncated — see the `semgrep-report` workflow artifact for full output._"]

        Path("semgrep-comment.md").write_text("\n".join(comment) + "\n")
        PY

    - name: Upload Semgrep report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: semgrep-report
        path: |
          semgrep-report.txt
          semgrep-report.json
        if-no-files-found: warn

    - name: Comment Semgrep results on PR
      if: always() && (github.event_name == 'pull_request' || inputs.pr-number != '')
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: semgrep-scan
        path: semgrep-comment.md
        number_force: ${{ inputs.pr-number }}

    # last, and deliberately not `if: always()` - by this point the report is
    # uploaded and the PR comment posted, so failing here still leaves the
    # reviewer everything they need to see why
    - name: Enforce severity gate
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
      run: |
        set -euo pipefail
        python3 <<'PY'
        import json, os, sys
        from pathlib import Path

        # lowest severity first; failing at index i fails everything above it
        ORDER = ["INFO", "WARNING", "ERROR"]
        threshold = os.environ["FAIL_ON_SEVERITY"]

        src = Path("semgrep-report.json")
        if not src.exists():
            print("::error::semgrep-report.json missing - the scan did not complete")
            sys.exit(1)

        results = json.loads(src.read_text()).get("results", [])
        cutoff = ORDER.index(threshold)

        blocking, below = [], 0
        for r in results:
            sev = (r.get("extra", {}).get("severity") or "INFO").upper()
            # an unrecognised severity is treated as blocking rather than ignored
            if sev not in ORDER or ORDER.index(sev) >= cutoff:
                blocking.append((sev, r.get("check_id", "?"), r.get("path", "?")))
            else:
                below += 1

        if below:
            print(f"{below} finding(s) below {threshold} - reported, not blocking.")

        if not blocking:
            print(f"No findings at or above {threshold}.")
            sys.exit(0)

        print(f"::error::{len(blocking)} finding(s) at or above {threshold}:")
        for sev, rule, path in blocking:
            print(f"  {sev}  {path}  {rule}")
        sys.exit(1)
        PY
