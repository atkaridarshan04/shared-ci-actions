name: Build candidate Docker image
description: Build and tag a candidate Docker image. Does not push - the caller logs into its registry and pushes as its own step, so the image can be scanned before it ever leaves the runner.
inputs:
  image-tag:
    description: Full tag to build, e.g. "ghcr.io/owner/repo:pr-42-api".
    required: true
  context:
    description: Build context path.
    required: false
    default: "."
  dockerfile-target:
    description: Optional Dockerfile stage to target (--target).
    required: false
    default: ""
  build-args:
    description: Newline-separated KEY=VALUE pairs, one --build-arg each.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build Docker image
      id: build
      shell: bash
      env:
        DOCKER_BUILDKIT: "1"
        IMAGE_TAG: ${{ inputs.image-tag }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE_TARGET: ${{ inputs.dockerfile-target }}
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        set -euo pipefail

        ARGS=()
        if [ -n "$DOCKERFILE_TARGET" ]; then
          ARGS+=(--target "$DOCKERFILE_TARGET")
        fi
        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--build-arg "$line")
        done <<< "$BUILD_ARGS"

        # ${ARGS[@]+...} so an empty ARGS is not an unbound variable under set -u
        docker build ${ARGS[@]+"${ARGS[@]}"} -t "$IMAGE_TAG" "$BUILD_CONTEXT"

    - name: Add build result to job summary
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.build.outcome }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        if [ "$OUTCOME" = "success" ]; then
          SIZE=$(docker image inspect --format '{{.Size}}' "$IMAGE_TAG" | awk '{printf "%.0f MB", $1/1000000}')
          printf '### Docker build\n\nBuilt `%s` (%s).\n' "$IMAGE_TAG" "$SIZE" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '### Docker build\n\nBuild of `%s` did not complete (%s). See the step log.\n' "$IMAGE_TAG" "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
        fi
